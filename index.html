<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Loopbox</title>
<meta name="description" content="Eine bunte Loop-Box: Farben antippen, aufnehmen, loopen.">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #2b2b2b;
    --radius: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }

  .view {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  [hidden] { display: none !important; }

  /* ---------- grid view ---------- */
  #gridView header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px 14px;
  }
  #gridView h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.01em; }
  .iconBtn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--ink);
  }
  .iconBtn:active { background: rgba(0, 0, 0, 0.07); }
  .iconBtn svg { width: 24px; height: 24px; }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 14px;
    min-height: 0;
  }
  .tile {
    border-radius: var(--radius);
    position: relative;
    transition: transform 0.12s ease;
  }
  .tile:active { transform: scale(0.96); }
  .tile .count {
    position: absolute;
    right: 12px; bottom: 10px;
    min-width: 26px; height: 26px;
    padding: 0 8px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.85);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .tile .count:empty { display: none; }

  /* ---------- folder view ---------- */
  #folderView { padding-left: 0; padding-right: 0; }
  #folderView header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 8px;
    color: #fff;
  }
  #folderView header .iconBtn { color: #fff; }
  #folderView header .iconBtn:active { background: rgba(255, 255, 255, 0.18); }
  #metroBtn .metroOff { display: none; }
  #metroBtn.off { opacity: 0.55; }
  #metroBtn.off .metroOff { display: block; }

  #blocks {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .block {
    flex: 0 0 auto;
    height: 62px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 6px 0 14px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .block .num {
    font-weight: 800;
    font-size: 1.05rem;
    width: 28px;
    flex: 0 0 auto;
    opacity: 0.85;
  }
  .block .track {
    flex: 1;
    align-self: stretch;
    position: relative;
    margin: 0 6px;
    touch-action: none;
  }
  .block .rail {
    position: absolute;
    left: 8px; right: 8px; top: 50%;
    height: 4px;
    margin-top: -2px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.10);
  }
  .block .dot {
    position: absolute;
    top: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    display: none;
  }
  .block.playing .dot, .block.scrubbing .dot { display: block; }
  .block .dur {
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.45;
    flex: 0 0 auto;
    margin-right: 2px;
  }
  .block .mute {
    width: 40px; height: 40px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.4;
    border-radius: 50%;
  }
  .block .mute svg { width: 20px; height: 20px; }
  .block .mute .muteOff { display: none; }
  .block .mute:active { background: rgba(0, 0, 0, 0.07); }
  .block.muted .num, .block.muted .track, .block.muted .dur { opacity: 0.35; }
  .block.muted .mute { opacity: 0.85; }
  .block.muted .mute .muteOn { display: none; }
  .block.muted .mute .muteOff { display: block; }
  .block .del {
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    font-weight: 700;
    opacity: 0.4;
    border-radius: 50%;
  }
  .block .del:active { background: rgba(0, 0, 0, 0.07); }
  .block.confirm .del {
    opacity: 1;
    color: #fff;
    background: #e5484d;
    font-size: 0.78rem;
  }

  #recArea {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 0 6px;
  }
  #recTimer {
    color: #fff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
    font-size: 1rem;
    opacity: 0.95;
  }
  #recRow {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  #playAllBtn {
    width: 62px; height: 62px;
    border-radius: 50%;
    background: #fff;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    transition: transform 0.12s ease;
  }
  #playAllBtn:active { transform: scale(0.94); }
  #playAllBtn .tri { width: 26px; height: 26px; margin-left: 3px; }
  #playAllBtn .sq { display: none; width: 20px; height: 20px; border-radius: 5px; background: var(--ink); }
  #playAllBtn.on .tri { display: none; }
  #playAllBtn.on .sq { display: block; }
  .recSpacer { width: 62px; flex: 0 0 auto; }
  #recRow.recording #playAllBtn { visibility: hidden; }
  #recBtn {
    width: 86px; height: 86px;
    border-radius: 50%;
    background: #fff;
    color: var(--ink);
    font-size: 3rem;
    font-weight: 300;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
    transition: transform 0.12s ease;
  }
  #recBtn:active { transform: scale(0.94); }
  #recBtn.recording { color: #e5484d; animation: pulse 1.2s ease-in-out infinite; }
  #recBtn.recording .plus { display: none; }
  #recBtn .stop { display: none; width: 30px; height: 30px; border-radius: 7px; background: #e5484d; }
  #recBtn.recording .stop { display: block; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,0.22), 0 0 0 0 rgba(255,255,255,0.55); }
    50% { box-shadow: 0 4px 18px rgba(0,0,0,0.22), 0 0 0 16px rgba(255,255,255,0); }
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #countdownOverlay {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    pointer-events: none;
  }
  #countdownNum {
    font-size: 30vw;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
  }
  .sheet {
    background: #fff;
    border-radius: 24px;
    padding: 26px 24px calc(22px + env(safe-area-inset-bottom));
    width: min(420px, calc(100% - 32px));
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
  }
  .sheet h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 18px; }
  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 0;
  }
  .setting .lbl { font-weight: 600; }
  .setting .hint { font-size: 0.78rem; opacity: 0.55; margin-top: 2px; }
  .switch {
    flex: 0 0 auto;
    width: 52px; height: 32px;
    border-radius: 16px;
    background: #d5d2ca;
    position: relative;
    transition: background 0.15s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    transition: left 0.15s ease;
  }
  .switch.on { background: #34c759; }
  .switch.on::after { left: 23px; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
  }
  .stepper button {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #eceae4;
    font-size: 1.3rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper button:active { background: #ddd9d0; }
  .stepper span {
    min-width: 44px;
    text-align: center;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .sheet .primary {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
  }
  .sheet .primary:active { opacity: 0.85; }

  #exportOverlay .sheet { text-align: center; }
  #exportProgress {
    height: 8px;
    border-radius: 4px;
    background: #eceae4;
    overflow: hidden;
    margin: 18px 0 6px;
  }
  #exportProgress > div {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: var(--ink);
    transition: width 0.2s linear;
  }
  #exportState { font-size: 0.85rem; opacity: 0.6; min-height: 1.2em; }
  #exportSave { display: none; }
  #exportOverlay.done #exportSave { display: block; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    max-width: calc(100% - 40px);
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="gridView" class="view">
  <header>
    <h1>Loopbox</h1>
    <button id="settingsBtn" class="iconBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.09a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/>
      </svg>
    </button>
  </header>
  <div id="grid"></div>
</div>

<div id="folderView" class="view" hidden>
  <header>
    <button id="backBtn" class="iconBtn" aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div style="display:flex;gap:6px;">
      <button id="metroBtn" class="iconBtn" aria-label="Metronom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 3h5L18 20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L9.5 3z"/>
          <path d="M12 14L17.5 5.5"/>
          <circle cx="12" cy="14.6" r="1.4" fill="currentColor" stroke="none"/>
          <path class="metroOff" d="M4 4l16 16" stroke-width="2.4"/>
        </svg>
      </button>
      <button id="exportBtn" class="iconBtn" aria-label="Exportieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V4"/>
          <path d="M7.5 8.5L12 4l4.5 4.5"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="blocks"></div>
  <div id="recArea">
    <div id="recTimer"></div>
    <div id="recRow">
      <button id="playAllBtn" aria-label="Alle Spuren abspielen">
        <svg class="tri" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10.4-6.5c.7-.4.7-1.4 0-1.8L9.6 4.6c-.7-.4-1.6.1-1.6.9z"/>
        </svg>
        <span class="sq"></span>
      </button>
      <button id="recBtn" aria-label="Aufnahme">
        <span class="plus">+</span>
        <span class="stop"></span>
      </button>
      <div class="recSpacer"></div>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="overlay" hidden>
  <div class="sheet">
    <h2>Einstellungen</h2>
    <div class="setting">
      <div>
        <div class="lbl">Countdown vor der Aufnahme</div>
        <div class="hint">3 · 2 · 1 — mit Metronom: 4 Schläge Einzähler</div>
      </div>
      <button class="switch" id="setCountdown" aria-label="Countdown"></button>
    </div>
    <div class="setting">
      <div>
        <div class="lbl">Tempo</div>
        <div class="hint">Schläge pro Minute fürs Metronom</div>
      </div>
      <div class="stepper">
        <button id="bpmDown" aria-label="Langsamer">−</button>
        <span id="bpmVal">90</span>
        <button id="bpmUp" aria-label="Schneller">+</button>
      </div>
    </div>
    <div class="setting">
      <div>
        <div class="lbl">Loops beim Aufnehmen</div>
        <div class="hint">Alte Aufnahmen laufen als Loop mit</div>
      </div>
      <button class="switch" id="setLoops" aria-label="Loops"></button>
    </div>
    <button class="primary" id="settingsClose">Fertig</button>
    <div id="appVersion" style="text-align:center;font-size:0.72rem;opacity:0.4;margin-top:12px;"></div>
  </div>
</div>

<div id="countdownOverlay" class="overlay" hidden>
  <div id="countdownNum">3</div>
</div>

<div id="exportOverlay" class="overlay" hidden>
  <div class="sheet">
    <h2>Video wird erstellt …</h2>
    <div id="exportProgress"><div></div></div>
    <div id="exportState"></div>
    <button class="primary" id="exportSave">Video sichern</button>
  </div>
</div>

<div id="toast"></div>

<script src="app.js?v=5"></script>
</body>
</html>
