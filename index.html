<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<title>Print Studio — Generative Art Prints</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141d;
    --panel-2: #1c1c2a;
    --line: #2a2a3a;
    --text: #e8e8f0;
    --muted: #8b8ba0;
    --accent: #ffd23f;
    --accent-2: #ee4266;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 880px) {
    .app { grid-template-columns: 1fr; }
  }
  aside.controls {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 20px 32px;
    overflow-y: auto;
    max-height: 100vh;
  }
  main.canvas-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: radial-gradient(ellipse at center, #1a1a25 0%, #06060a 75%);
    min-height: 60vh;
    position: relative;
  }
  canvas#preview {
    max-width: 100%;
    max-height: calc(100vh - 60px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
    border-radius: 4px;
    background: #000;
    cursor: pointer;
  }
  h1 {
    font-size: 19px; margin: 0 0 4px;
    letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-2);
  }
  .tagline { color: var(--muted); font-size: 12.5px; margin: 0 0 22px; line-height: 1.5; }
  .group { margin: 0 0 16px; }
  .group label.heading {
    display: block;
    font-size: 10.5px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .btns.three { grid-template-columns: repeat(3, 1fr); }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 11px;
    font-size: 12.5px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
    font-family: inherit;
  }
  .btn:hover { background: #252535; border-color: #3a3a4a; }
  .btn.active {
    background: linear-gradient(180deg, var(--accent), #f4b400);
    color: #0a0a0f;
    border-color: transparent;
    font-weight: 600;
  }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .swatch.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,210,63,0.25);
  }
  .swatch .stripe { flex: 1; }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
    margin: 6px 0 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: 0;
  }
  .val { font-size: 11px; color: var(--muted); float: right; }
  .big {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
  }
  .big.primary {
    background: linear-gradient(180deg, var(--accent), #f4b400);
    color: #0a0a0f;
  }
  .big.primary:hover { filter: brightness(1.06); }
  .big.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .big.secondary:hover { background: #252535; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat { font-size: 11px; color: var(--muted); margin: 10px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 6px;
  }
  #gallery .thumb {
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--line);
    background-size: cover;
    background-position: center;
    transition: transform 0.12s;
  }
  #gallery .thumb:hover { transform: scale(1.06); border-color: var(--accent); }
  #gallery .empty { grid-column: 1/-1; color: var(--muted); font-size: 11.5px; padding: 8px 2px; }
  #busy {
    position: absolute; inset: 0;
    background: rgba(6,6,10,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 13px;
    backdrop-filter: blur(2px);
    z-index: 10;
  }
  #busy.on { display: flex; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 14px;
  }
  @media (max-width: 880px) {
    aside.controls { order: 2; max-height: none; border-right: 0; border-top: 1px solid var(--line); }
    main.canvas-wrap { order: 1; padding: 16px; }
    canvas#preview { max-height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <h1><span class="dot"></span>Print Studio</h1>
    <p class="tagline">Generate unique high-resolution art prints. Click the canvas to remix. Save favorites. Download in 4K — yours to keep, hang, or list.</p>

    <div class="group">
      <label class="heading">Style</label>
      <div class="btns three" id="styles">
        <button class="btn active" data-style="flow">Flow</button>
        <button class="btn" data-style="voronoi">Voronoi</button>
        <button class="btn" data-style="mandala">Mandala</button>
        <button class="btn" data-style="plasma">Plasma</button>
        <button class="btn" data-style="tiles">Tiles</button>
        <button class="btn" data-style="dither">Dither</button>
      </div>
    </div>

    <div class="group">
      <label class="heading">Palette</label>
      <div class="swatches" id="palettes"></div>
    </div>

    <div class="group">
      <label class="heading">Density <span class="val" id="densityVal">50</span></label>
      <input type="range" id="density" min="1" max="100" value="50" />
    </div>

    <div class="group">
      <label class="heading">Aspect</label>
      <div class="btns" id="aspects">
        <button class="btn active" data-aspect="1:1">Square</button>
        <button class="btn" data-aspect="4:5">Print 4:5</button>
        <button class="btn" data-aspect="2:3">Poster</button>
        <button class="btn" data-aspect="16:9">Wide</button>
      </div>
    </div>

    <div class="group" style="margin-top: 22px">
      <button class="big primary" id="regen">Regenerate</button>
    </div>
    <div class="row">
      <button class="big secondary" id="save">Save</button>
      <button class="big secondary" id="download">Download 4K</button>
    </div>
    <p class="stat" id="seed-info"></p>

    <div class="group" style="margin-top: 22px">
      <label class="heading">Saved Prints</label>
      <div id="gallery"></div>
    </div>

    <p class="hint">Tip: tap the canvas for a new seed</p>
  </aside>

  <main class="canvas-wrap">
    <canvas id="preview"></canvas>
    <div id="busy"><div class="spinner"></div>Rendering 4K…</div>
  </main>
</div>

<script>
'use strict';

// ---------- PRNG ----------
function mulberry32(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Perlin noise ----------
class Noise {
  constructor(rng) {
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    this.p = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
  }
  noise2(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = this.fade(x), v = this.fade(y);
    const A = this.p[X] + Y, B = this.p[X + 1] + Y;
    return this.lerp(
      this.lerp(this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y), u),
      this.lerp(this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1), u),
      v
    );
  }
  fbm(x, y, octaves) {
    let v = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
      v += amp * this.noise2(x * freq, y * freq);
      max += amp; amp *= 0.5; freq *= 2;
    }
    return v / max;
  }
}

// ---------- Palettes ----------
const PALETTES = {
  sunset:    ['#fde7c1','#f8b878','#ef7b45','#cf3759','#5c0e62'],
  ocean:     ['#caf0f8','#90e0ef','#00b4d8','#0077b6','#03045e'],
  forest:    ['#dad7cd','#a3b18a','#588157','#3a5a40','#1f2e23'],
  neon:      ['#ffbe0b','#fb5607','#ff006e','#8338ec','#3a86ff'],
  vaporwave: ['#fffb96','#05ffa1','#01cdfe','#b967ff','#ff71ce'],
  mono:      ['#f5f5f5','#bbbbbb','#7a7a7a','#3a3a3a','#0a0a0a'],
  pastel:    ['#ffaebc','#ffd6e0','#ffefcf','#d4f0f0','#a0c4ff'],
  fire:      ['#fff3b0','#ffd60a','#ff9500','#e63946','#5b0a0a'],
  earth:     ['#f1ddc4','#d6a77a','#a26a4b','#6b4226','#2b1a10'],
  cyber:     ['#f7e733','#05d9e8','#ff2a6d','#7a04eb','#0d0221'],
  twilight:  ['#f9e4d4','#e6a4b4','#7474bf','#302b63','#0f0c29'],
  desert:    ['#f6bd60','#f7ede2','#f5cac3','#84a59d','#34495e'],
};

// ---------- Color helpers ----------
function hexToRgb(h) {
  const v = parseInt(h.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function lerpRgb(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t,
  ];
}
function paletteRgb(palette, t) {
  t = Math.max(0, Math.min(0.999999, t));
  const seg = t * (palette.length - 1);
  const i = Math.floor(seg);
  const a = hexToRgb(palette[i]);
  const b = hexToRgb(palette[i + 1]);
  return lerpRgb(a, b, seg - i);
}
function paletteCss(palette, t) {
  const c = paletteRgb(palette, t);
  return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}
function paletteCssA(palette, t, alpha) {
  const c = paletteRgb(palette, t);
  return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${alpha})`;
}

// ---------- Algorithms ----------
function background(ctx, w, h, palette) {
  ctx.fillStyle = palette[palette.length - 1];
  ctx.fillRect(0, 0, w, h);
}

function flowField(ctx, opts) {
  const { w, h, palette, density, rng, noise } = opts;
  background(ctx, w, h, palette);
  const particles = Math.floor(120 + density * 6);
  const steps = 220;
  const baseScale = 0.0022;
  const swirl = 1.8 + (density / 100) * 2;
  ctx.lineCap = 'round';
  const baseWidth = Math.max(0.4, (w / 1400) * 1.4);
  for (let p = 0; p < particles; p++) {
    let x = rng() * w, y = rng() * h;
    const t = rng();
    const col = paletteCssA(palette, t, 0.55);
    ctx.strokeStyle = col;
    ctx.lineWidth = baseWidth * (0.5 + rng() * 1.6);
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let s = 0; s < steps; s++) {
      const n = noise.fbm(x * baseScale, y * baseScale, 3);
      const a = n * Math.PI * swirl;
      x += Math.cos(a) * 1.6;
      y += Math.sin(a) * 1.6;
      if (x < -10 || y < -10 || x > w + 10 || y > h + 10) break;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function plasma(ctx, opts) {
  const { w, h, palette, density, noise } = opts;
  const img = ctx.createImageData(w, h);
  const data = img.data;
  const scale = 0.0015 + (101 - density) * 0.00006;
  const oct = 3 + Math.round(density / 25);
  let i = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const n = (noise.fbm(x * scale, y * scale, oct) + 1) * 0.5;
      const c = paletteRgb(palette, n);
      data[i++] = c[0] | 0; data[i++] = c[1] | 0; data[i++] = c[2] | 0; data[i++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function voronoi(ctx, opts) {
  const { w, h, palette, density, rng } = opts;
  const count = Math.floor(25 + density * 2);
  const pts = [];
  for (let i = 0; i < count; i++) {
    pts.push({ x: rng() * w, y: rng() * h, t: rng() });
  }
  const img = ctx.createImageData(w, h);
  const data = img.data;
  const step = Math.max(1, Math.floor(w / 1100));
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      let bd = Infinity, bp = pts[0];
      for (let i = 0; i < count; i++) {
        const dx = pts[i].x - x, dy = pts[i].y - y;
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; bp = pts[i]; }
      }
      const c = paletteRgb(palette, bp.t);
      const sd = Math.min(1, Math.sqrt(bd) / (Math.min(w, h) * 0.18));
      const sh = 0.65 + 0.35 * (1 - sd);
      const r = (c[0] * sh) | 0, g = (c[1] * sh) | 0, b = (c[2] * sh) | 0;
      for (let dy = 0; dy < step && y + dy < h; dy++) {
        for (let dx = 0; dx < step && x + dx < w; dx++) {
          const idx = ((y + dy) * w + (x + dx)) * 4;
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function mandala(ctx, opts) {
  const { w, h, palette, density, rng } = opts;
  background(ctx, w, h, palette);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  const symmetry = 6 + Math.floor(rng() * 7);
  const rings = 5 + Math.floor(density / 11);
  const maxR = Math.min(w, h) * 0.48;
  for (let ring = 0; ring < rings; ring++) {
    const r0 = (ring / rings) * maxR;
    const r1 = ((ring + 1) / rings) * maxR;
    const subdiv = 2 + Math.floor(rng() * 4);
    const segs = symmetry * subdiv;
    const colA = rng();
    const colB = rng();
    for (let s = 0; s < segs; s++) {
      const a0 = (s / segs) * Math.PI * 2;
      const a1 = ((s + 1) / segs) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(0, 0, r1, a0, a1);
      ctx.arc(0, 0, r0, a1, a0, true);
      ctx.closePath();
      ctx.fillStyle = paletteCssA(palette, (s % 2 === 0) ? colA : colB, 0.85);
      ctx.fill();
    }
    if (rng() > 0.35) {
      const dotR = (r1 - r0) * (0.12 + rng() * 0.18);
      const midR = (r0 + r1) / 2;
      const dots = symmetry * (rng() > 0.5 ? 1 : 2);
      ctx.fillStyle = paletteCss(palette, rng());
      for (let d = 0; d < dots; d++) {
        const a = (d / dots) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * midR, Math.sin(a) * midR, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function tiles(ctx, opts) {
  const { w, h, palette, density, rng } = opts;
  background(ctx, w, h, palette);
  const cols = 5 + Math.floor(density / 8);
  const rows = Math.max(1, Math.floor(cols * h / w));
  const cw = w / cols, ch = h / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cw, y = r * ch;
      const base = paletteCss(palette, rng());
      ctx.fillStyle = base;
      ctx.fillRect(x, y, cw + 1, ch + 1);
      const choice = rng();
      ctx.fillStyle = paletteCss(palette, rng());
      ctx.beginPath();
      if (choice < 0.25) {
        ctx.moveTo(x, y); ctx.lineTo(x + cw, y); ctx.lineTo(x + cw, y + ch);
        ctx.closePath(); ctx.fill();
      } else if (choice < 0.5) {
        ctx.arc(x + cw / 2, y + ch / 2, Math.min(cw, ch) * 0.42, 0, Math.PI * 2);
        ctx.fill();
      } else if (choice < 0.75) {
        ctx.moveTo(x + cw / 2, y);
        ctx.lineTo(x + cw, y + ch / 2);
        ctx.lineTo(x + cw / 2, y + ch);
        ctx.lineTo(x, y + ch / 2);
        ctx.closePath(); ctx.fill();
      } else {
        const bars = 2 + Math.floor(rng() * 4);
        for (let b = 0; b < bars; b++) {
          ctx.fillStyle = paletteCss(palette, rng());
          ctx.fillRect(x, y + (b / bars) * ch, cw, ch / bars * 0.55);
        }
      }
    }
  }
}

function dither(ctx, opts) {
  const { w, h, palette, density, noise } = opts;
  const bayer = [
    [ 0,32, 8,40, 2,34,10,42],
    [48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],
    [60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],
    [51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],
    [63,31,55,23,61,29,53,21],
  ];
  const img = ctx.createImageData(w, h);
  const data = img.data;
  const pixSize = Math.max(2, Math.round((w / 500) * (1 + (100 - density) / 30)));
  const scale = 0.003;
  for (let y = 0; y < h; y += pixSize) {
    for (let x = 0; x < w; x += pixSize) {
      const n = (noise.fbm(x * scale, y * scale, 3) + 1) * 0.5;
      const thr = bayer[((y / pixSize) | 0) % 8][((x / pixSize) | 0) % 8] / 64;
      const t = Math.max(0, Math.min(0.999, n + (thr - 0.5) * 0.18));
      const c = paletteRgb(palette, t);
      const r = c[0] | 0, g = c[1] | 0, b = c[2] | 0;
      for (let dy = 0; dy < pixSize && y + dy < h; dy++) {
        for (let dx = 0; dx < pixSize && x + dx < w; dx++) {
          const idx = ((y + dy) * w + (x + dx)) * 4;
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

const ALGOS = { flow: flowField, voronoi, mandala, plasma, tiles, dither };

// ---------- State ----------
const state = {
  style: 'flow',
  paletteName: 'sunset',
  density: 50,
  aspect: '1:1',
  seed: (Math.random() * 1e9) | 0,
};

function aspectDims(aspect, longSide) {
  const [a, b] = aspect.split(':').map(Number);
  if (a >= b) return { w: longSide, h: Math.round(longSide * b / a) };
  return { w: Math.round(longSide * a / b), h: longSide };
}

function renderTo(canvas, longSide) {
  const { w, h } = aspectDims(state.aspect, longSide);
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  const rng = mulberry32(state.seed);
  const noise = new Noise(rng);
  const palette = PALETTES[state.paletteName];
  ALGOS[state.style](ctx, { w, h, palette, density: state.density, rng, noise });
}

function renderPreview() {
  const c = document.getElementById('preview');
  const wrapW = window.innerWidth - (window.innerWidth > 880 ? 380 : 32);
  const wrapH = window.innerHeight - (window.innerWidth > 880 ? 60 : 80);
  const longSide = Math.max(540, Math.min(1400, Math.min(wrapW, wrapH * (state.aspect === '16:9' ? 16/9 : 1.4))));
  renderTo(c, longSide | 0);
  document.getElementById('seed-info').textContent =
    `seed ${state.seed} · ${state.style} · ${state.paletteName} · ${state.aspect}`;
}

function downloadHighRes() {
  const busy = document.getElementById('busy');
  busy.classList.add('on');
  setTimeout(() => {
    const c = document.createElement('canvas');
    renderTo(c, 3840);
    c.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `print-${state.style}-${state.paletteName}-${state.seed}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      busy.classList.remove('on');
    }, 'image/png');
  }, 30);
}

function saveToGallery() {
  const c = document.createElement('canvas');
  renderTo(c, 360);
  const thumb = c.toDataURL('image/jpeg', 0.72);
  const items = JSON.parse(localStorage.getItem('gallery') || '[]');
  items.unshift({
    style: state.style,
    paletteName: state.paletteName,
    density: state.density,
    aspect: state.aspect,
    seed: state.seed,
    thumb,
  });
  if (items.length > 18) items.length = 18;
  localStorage.setItem('gallery', JSON.stringify(items));
  renderGallery();
}

function renderGallery() {
  const g = document.getElementById('gallery');
  const items = JSON.parse(localStorage.getItem('gallery') || '[]');
  g.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No saved prints yet.';
    g.appendChild(e);
    return;
  }
  items.forEach((it) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url(${it.thumb})`;
    div.title = `${it.style} · ${it.paletteName} (click to load)`;
    div.addEventListener('click', () => {
      state.style = it.style;
      state.paletteName = it.paletteName;
      state.density = it.density;
      state.aspect = it.aspect;
      state.seed = it.seed;
      syncUI(); renderPreview();
    });
    g.appendChild(div);
  });
}

function syncUI() {
  document.querySelectorAll('#styles .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.style === state.style);
  });
  document.querySelectorAll('#aspects .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.aspect === state.aspect);
  });
  document.querySelectorAll('#palettes .swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.palette === state.paletteName);
  });
  document.getElementById('density').value = state.density;
  document.getElementById('densityVal').textContent = state.density;
}

function buildPalettes() {
  const wrap = document.getElementById('palettes');
  Object.entries(PALETTES).forEach(([name, cols]) => {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.dataset.palette = name;
    s.title = name;
    cols.forEach((c) => {
      const st = document.createElement('div');
      st.className = 'stripe';
      st.style.background = c;
      s.appendChild(st);
    });
    s.addEventListener('click', () => {
      state.paletteName = name;
      syncUI(); renderPreview();
    });
    wrap.appendChild(s);
  });
}

function init() {
  buildPalettes();
  syncUI();
  document.querySelectorAll('#styles .btn').forEach(b => {
    b.addEventListener('click', () => {
      state.style = b.dataset.style;
      state.seed = (Math.random() * 1e9) | 0;
      syncUI(); renderPreview();
    });
  });
  document.querySelectorAll('#aspects .btn').forEach(b => {
    b.addEventListener('click', () => {
      state.aspect = b.dataset.aspect;
      syncUI(); renderPreview();
    });
  });
  const dens = document.getElementById('density');
  let densTimer;
  dens.addEventListener('input', () => {
    state.density = +dens.value;
    document.getElementById('densityVal').textContent = state.density;
    clearTimeout(densTimer);
    densTimer = setTimeout(renderPreview, 60);
  });
  document.getElementById('regen').addEventListener('click', () => {
    state.seed = (Math.random() * 1e9) | 0;
    renderPreview();
  });
  document.getElementById('save').addEventListener('click', saveToGallery);
  document.getElementById('download').addEventListener('click', downloadHighRes);
  document.getElementById('preview').addEventListener('click', () => {
    state.seed = (Math.random() * 1e9) | 0;
    renderPreview();
  });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderPreview, 100);
  });
  renderGallery();
  renderPreview();
}

init();
</script>
</body>
</html>
